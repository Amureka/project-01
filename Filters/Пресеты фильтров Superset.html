<title>Пресеты фильтров Superset</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: demo strip on top, then an app frame with the 288px filter bar on the left and a chart canvas on the right.
   One deliberate light look that copies Superset's own theme (primary #2893B3, Inter, 4px radius). */
:root {
  --primary: #2893B3;
  --primary-bg: #E8F4F8;
  --primary-border: #B5DCE8;
  --ink: #1F2A33;
  --ink-2: #4B5A66;
  --ink-3: #7B8893;
  --line: #E3E8EC;
  --line-strong: #D0D7DD;
  --surface: #FFFFFF;
  --ground: #F2F5F7;
  --warn: #B26A00;
  --warn-bg: #FFF7E6;
  --warn-line: #FFD591;
  --off: #A0AAB2;
  color-scheme: light;
}
html, body { background: var(--ground); }
body {
  margin: 0;
  color: var(--ink);
  font-family: Inter, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  font-size: 14px;
  line-height: 1.5;
  padding-block: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.page { max-width: 1280px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
.muted { color: var(--ink-3); }

/* demo strip */
.demo { display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: center; justify-content: space-between;
  background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 10px 14px; }
.demo-text { min-width: 0; flex: 1 1 360px; color: var(--ink-2); font-size: 13px; }
.demo-text strong { color: var(--ink); font-weight: 600; }
.demo-ctl { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
.demo-switch { display: inline-flex; gap: 8px; align-items: center; font-size: 13px; cursor: pointer; }

/* frame */
.frame { display: flex; background: var(--surface); border: 1px solid var(--line-strong); border-radius: 8px;
  overflow: hidden; height: 780px; max-height: calc(100vh - 140px); min-height: 620px; }
.bar { width: 288px; flex: none; display: flex; flex-direction: column; border-right: 1px solid var(--line);
  background: var(--surface); position: relative; min-height: 0; }
.bar-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 10px; }
.bar-title { font-size: 16px; font-weight: 600; }
.bar-icons { display: flex; gap: 12px; font-size: 18px; }
.ic-primary { color: var(--primary); }

/* preset selector */
.preset-row { display: flex; gap: 8px; padding: 0 16px 12px; }
.preset-btn { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 10px;
  border: 1px solid var(--line-strong); border-radius: 4px; background: var(--surface); color: var(--ink);
  font: inherit; cursor: pointer; text-align: left; }
.preset-btn:hover { border-color: var(--primary); color: var(--primary); }
.preset-btn:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
.preset-btn.on { border-color: var(--primary-border); background: var(--primary-bg); }
.pb-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pb-caret { font-size: 10px; color: var(--ink-3); }
.pb-tag { margin: 0; font-size: 11px; line-height: 18px; padding-inline: 6px; }
.bar-alert { margin: 0 16px 12px; padding: 8px 10px; }
.bar-alert .ant-alert-message { font-size: 13px; font-weight: 600; }
.bar-alert .ant-alert-description { font-size: 12px; }
.alert-act { margin-top: 2px; }
.alert-act .ant-btn { padding: 0; height: auto; }

/* filters */
.bar-scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 16px 24px; display: flex; flex-direction: column; gap: 16px; }
.fc-label { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; font-size: 13px; font-weight: 500; }
.fc-label .ant-tag { margin: 0; font-size: 11px; line-height: 18px; }
.range-hint { font-size: 12px; color: var(--ink-3); margin-top: 2px; }

.actions { flex: none; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 16px 16px 14px;
  border-top: 1px solid var(--line); background: var(--surface); }
.act-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 0 12px; }
.lnk.ant-btn { color: var(--ink-2); padding-inline: 4px; }
.lnk.ant-btn:not(:disabled):hover { color: var(--primary); }

/* canvas */
.canvas { flex: 1; min-width: 0; background: var(--ground); padding: 16px; overflow-y: auto; }
.canvas-head h1 { margin: 0 0 4px; font-size: 20px; font-weight: 600; }
.canvas-head p { margin: 0 0 14px; color: var(--ink-2); font-size: 13px; max-width: 70ch; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
.chart { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 12px; min-width: 0;
  display: flex; flex-direction: column; gap: 10px; transition: opacity .15s, border-color .15s, box-shadow .15s; }
.chart.hl { border-color: var(--primary); box-shadow: 0 0 0 2px var(--primary-bg); }
.chart.dim { opacity: .5; }
.chart header { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
.chart h2 { margin: 0; font-size: 14px; font-weight: 600; min-width: 0; }
.excl { color: var(--warn); font-size: 14px; line-height: 1; padding: 3px; border-radius: 4px; cursor: help; }
.excl:focus-visible { outline: 2px solid var(--primary); }
.bars { display: flex; align-items: flex-end; gap: 5px; height: 64px; }
.bars i { flex: 1; background: var(--primary-border); border-radius: 2px 2px 0 0; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; min-height: 22px; font-size: 12px; }
.chips .ant-tag { margin: 0; max-width: 100%; white-space: normal; }

/* preset panel */
.pp-pop .ant-popover-inner { padding: 0; }
.pp { display: flex; width: 700px; max-width: calc(100vw - 32px); height: 480px; }
.pp-list { width: 320px; flex: none; display: flex; flex-direction: column; border-right: 1px solid var(--line); min-width: 0; }
.pp-search { padding: 12px 12px 8px; }
.pp-scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 0 6px 6px; }
.pp-sec { padding: 8px 8px 4px; font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-3); }
.pp-foot { padding: 10px 12px; border-top: 1px solid var(--line); }
.pp-empty { padding: 16px 10px; color: var(--ink-3); font-size: 13px; }

.pi { padding: 8px 8px 8px 10px; border-radius: 4px; cursor: pointer; border: 1px solid transparent; }
.pi:focus-visible { outline: 2px solid var(--primary); outline-offset: -2px; }
.pi.preview { background: var(--ground); }
.pi.active { background: var(--primary-bg); border-color: var(--primary-border); }
.pi-top { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.pi-name { font-weight: 500; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pi-check { color: var(--primary); margin-right: 6px; font-size: 12px; }
.pi-clock { color: var(--ink-3); margin-right: 6px; font-size: 12px; }
.pi-sum { font-size: 12px; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 1px; }
.pi-meta { display: flex; flex-wrap: wrap; gap: 2px 10px; margin-top: 4px; font-size: 12px; color: var(--ink-3); }
.pi-flag { display: inline-flex; gap: 4px; align-items: center; }
.pi-flag.warn { color: var(--warn); }
.pi.recent .pi-name { font-weight: 400; }
.pi .ant-btn-link { padding: 0 4px; height: 22px; }

/* preview */
.pp-preview { flex: 1; min-width: 0; display: flex; flex-direction: column; padding: 14px 16px; }
.pv-eyebrow { font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-3); }
.pv-title { font-size: 15px; font-weight: 600; margin: 2px 0 10px; overflow-wrap: anywhere; }
.pv-rows { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; }
.pv-row { display: grid; grid-template-columns: 1fr auto; grid-template-areas: 'label scope' 'val val'; gap: 4px 8px;
  padding: 8px 0; border-bottom: 1px solid var(--line); align-items: center; }
.pv-label { grid-area: label; font-weight: 500; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; min-width: 0; }
.pv-label .ant-tag { margin: 0; font-size: 11px; line-height: 18px; }
.pv-val { grid-area: val; font-size: 13px; min-width: 0; }
.pv-scope { grid-area: scope; font-size: 12px; }
.pv-row.new { background: var(--warn-bg); margin-inline: -8px; padding-inline: 8px; border-radius: 4px; border-bottom-color: transparent; }
.pv-row.gone .pv-label { color: var(--off); text-decoration: line-through; }
.pv-row.gone .pv-val { opacity: .6; }
.pv-foot { display: flex; gap: 8px; padding-top: 12px; }
.vtags { display: inline-flex; flex-wrap: wrap; gap: 4px; }
.vtags .ant-tag { margin: 0; }

.scope-chip { display: inline-flex; align-items: center; gap: 4px; border: 0; background: transparent; color: var(--ink-3);
  font: inherit; font-size: 12px; padding: 1px 6px; border-radius: 10px; cursor: pointer; white-space: nowrap; }
.scope-chip.partial { background: var(--primary-bg); color: #1B6F8A; font-weight: 500; }
.scope-chip:hover { background: var(--primary-bg); }
.scope-chip:focus-visible { outline: 2px solid var(--primary); }
.scope-pop { z-index: 1100; }
.scope-list { display: flex; flex-direction: column; gap: 6px; min-width: 260px; }
.scope-row { display: grid; grid-template-columns: 16px 1fr auto; gap: 6px; align-items: center; font-size: 13px; }
.scope-row .anticon { color: var(--primary); }
.scope-row em { font-style: normal; font-size: 11px; color: var(--ink-3); }
.scope-row.off { color: var(--ink-3); }
.scope-row.off .anticon { color: var(--off); }

/* save dialog */
.sm-label { display: block; font-size: 13px; font-weight: 500; margin: 12px 0 6px; }
.sm-label:first-child { margin-top: 0; }
.sm-err { min-height: 20px; color: #CF1322; font-size: 12px; margin-top: 4px; }
.sm-rows { border: 1px solid var(--line); border-radius: 4px; }
.sm-row { display: grid; grid-template-columns: minmax(110px, 1fr) minmax(0, 1.4fr) auto; gap: 8px; align-items: center;
  padding: 8px 10px; border-bottom: 1px solid var(--line); }
.sm-row:last-child { border-bottom: 0; }
.sm-note { margin-top: 12px; font-size: 12px; color: var(--ink-3); }

/* narrow screens */
@media (max-width: 760px) {
  .frame { flex-direction: column; height: auto; max-height: none; }
  .bar { width: auto; border-right: 0; border-bottom: 1px solid var(--line); }
  .bar-scroll { overflow: visible; }
  .pp { height: 440px; }
  .pp-list { width: 100%; border-right: 0; }
  .pp-preview { display: none; }
  .sm-row { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) { .chart { transition: none; } }
</style>
